[package]
name = "meetily-transcript-persistence-tests"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
anyhow = "=1.0.102"
serde_json = "=1.0.149"
chrono = "=0.4.44"
tempfile = "=3.27.0"
serde = { version = "=1.0.228", features = ["derive"] }

log = "=0.4.29"
bytemuck = "=1.25.0"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tauri = { version = "=2.11.1", default-features = false }
